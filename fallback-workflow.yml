# Install this file as .github/workflows/deploy.yml in the dedicated fallback repository.
# Keep that repository's Pages custom domain unset, so its github.io URL stays independent.
name: Publish independent status fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yomumi-status-fallback
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout fallback assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install locked server dependencies for source verification
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Verify fixture-only monitor, client, build and Elysia contracts
        run: bun --no-env-file run test
      - name: Build fallback with independently hosted observations
        env:
          STATUS_DATA_URL: https://raw.githubusercontent.com/Lumichandesu/yomumi-status/main/public/status.json
        run: bun --no-env-file run build
      - name: Upload small Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
      - name: Deploy fallback without a custom domain
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
